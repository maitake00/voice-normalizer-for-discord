# Optional config file for the command-line version.
# Copy it to config.toml only if you want to change something.

[discord]
# Leave empty to use the standard app (works for registered testers).
# To use your own Discord application, paste its Client ID here
# (turn on "Public Client" and add the redirect http://127.0.0.1 in its OAuth2 settings).
client_id = ""

[params]
target_db = -24.0     # target loudness (dB)
percentile = 87.5     # percentile treated as a person's voice level (see "Balancing" in the README)
window = 600          # histogram window (blocks of 100 ms; 600 = 60 seconds)
min_samples = 50      # minimum samples before adjusting a person
deadband_db = 1.5     # differences smaller than this are left alone
max_step_db = 3.0     # maximum change per adjustment

[ui]
language = "auto"     # "auto" (Windows display language), "en", or "ja"

[debug]
# If true, measurement frames (time, user_id, dB, volume%) are written to frames.csv.
# Numbers only; no audio is saved.
frame_log = false
